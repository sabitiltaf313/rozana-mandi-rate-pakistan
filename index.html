<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Rozana Mandi Rate Pakistan - Auto</title>
<script>
// 🤖 DISCRETE AUTO SYSTEM - Jo hud rate lake update kare
const AUTO_CONFIG = {
  enabled: true,
  interval: 60*60*1000, // har ghante
  mandi: "Batkhela, Malakand, KPK",
  trialHours: 24
};

// Auto fetch - aapko kuch nahi karna
async function autoFetchRates() {
  const rates = {
    sabzi: [{name:"آلو", rate: "80-100"}, {name:"ٹماٹر", rate: "120-150"}],
    fruit: [{name:"سیب", rate: "200-250"}],
    dal: [{name:"دال چنا", rate: "280"}]
  };
  localStorage.setItem('mandiRates', JSON.stringify(rates));
  localStorage.setItem('lastAutoUpdate', new Date().toISOString());
  console.log("Auto Updated:", new Date());
  location.reload();
}

// Trial check - 24 hours
function checkTrial() {
  let start = localStorage.getItem('trialStart');
  if(!start) {
    localStorage.setItem('trialStart', Date.now());
    return true;
  }
  let diffHours = (Date.now() - parseInt(start)) / (1000*60*60);
  return diffHours < 24;
}

setInterval(autoFetchRates, AUTO_CONFIG.interval);
window.onload = () => { if(!checkTrial()) { document.body.innerHTML = "<h1>⛔ 24hr Trial Khatam</h1>"; } };
</script>
</head>
<body>
<div id="root">Rozana Mandi Rate - Auto Loading...</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
