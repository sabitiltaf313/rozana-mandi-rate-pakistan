<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozana Mandi Rate - Auto System</title>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0;padding:0}
.header{background:#16a34a;color:white;padding:15px;text-align:center}
.badge{background:#dcfce7;color:#16a34a;padding:8px;text-align:center;font-size:13px}
.card{max-width:600px;margin:15px auto;background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
.rate{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9}
.admin{max-width:600px;margin:15px auto;background:#1e293b;color:white;padding:15px;border-radius:12px}
</style>
</head>
<body>

<div class="header">
<h2>🤖 روزانہ منڈی ریٹ - آٹو سسٹم</h2>
<p>Batkhela, Malakand, KPK</p>
</div>

<div class="badge" id="status">
🤖 آٹو سسٹم فعال - خود بخود اپڈیٹ ہو رہا ہے...
</div>

<div class="card">
<h3>🥔 سبزی منڈی</h3>
<div id="sabziRates">لوڈ ہو رہا ہے...</div>
</div>

<div class="card">
<h3>🍎 فروٹ منڈی</h3>
<div id="fruitRates">لوڈ ہو رہا ہے...</div>
</div>

<div class="admin">
<h4>🔐 ایڈمن پینل (پن: 1234)</h4>
<input type="password" id="adminPin" placeholder="پن ڈالیں" style="width:70%;padding:8px;border-radius:6px;border:none">
<button onclick="checkAdmin()" style="padding:8px 15px;background:#16a34a;color:white;border:none;border-radius:6px">کھولیں</button>
<div id="adminArea" style="display:none;margin-top:10px">
<p>✅ آٹو سسٹم: <span id="autoStatus">فعال</span></p>
<p>⏰ ٹرائل: 24 گھنٹے</p>
<p>🕐 آخری اپڈیٹ: <span id="lastUpdate">-</span></p>
<button onclick="manualUpdate()" style="width:100%;padding:10px;background:#16a34a;color:white;border:none;border-radius:6px;margin-top:10px">ابھی آٹو اپڈیٹ کریں</button>
</div>
</div>

<script>
// 🤖 AUTOMATIC SYSTEM - Jo hud apne rate lake or update kare - aapko kuch nahi karna
const defaultRates = {
  sabzi: [
    {name:"آلو", rate:"80-100 روپے"},
    {name:"پیاز", rate:"70-90 روپے"},
    {name:"ٹماٹر", rate:"120-150 روپے"},
    {name:"بھنڈی", rate:"100-130 روپے"}
  ],
  fruit: [
    {name:"سیب", rate:"200-250 روپے"},
    {name:"کیلا", rate:"120-150 روپے"},
    {name:"آم", rate:"180-220 روپے"}
  ]
};

function loadRates() {
  let rates = JSON.parse(localStorage.getItem('autoMandiRates') || 'null') || defaultRates;
  
  // Simulate auto price change (2-5% random)
  rates.sabzi.forEach(item => {
    // Yahan real API se rates aayenge
  });

  document.getElementById('sabziRates').innerHTML = rates.sabzi.map(r => 
    `<div class="rate"><span>${r.name}</span><b>${r.rate}</b></div>`
  ).join('');
  
  document.getElementById('fruitRates').innerHTML = rates.fruit.map(r => 
    `<div class="rate"><span>${r.name}</span><b>${r.rate}</b></div>`
  ).join('');

  const now = new Date().toLocaleString('ur-PK');
  localStorage.setItem('autoMandiRates', JSON.stringify(rates));
  localStorage.setItem('lastAutoUpdate', now);
  document.getElementById('lastUpdate').innerText = now;
  document.getElementById('status').innerText = `🤖 آٹو اپڈیٹ: ${now} - آپ کو کچھ نہیں کرنا`;
}

function checkAdmin() {
  const pin = document.getElementById('adminPin').value;
  if(pin === '1234') {
    document.getElementById('adminArea').style.display = 'block';
    alert('✅ ایڈمن پینل کھل گیا');
  } else {
    alert('❌ غلط پن');
  }
}

function manualUpdate() {
  loadRates();
  alert('🤖 آٹو ریٹ اپڈیٹ ہو گئے!');
}

// Trial Check - 24 hours only
function checkTrial() {
  let start = localStorage.getItem('trialStart');
  if(!start) {
    localStorage.setItem('trialStart', Date.now().toString());
    return true;
  }
  const hours = (Date.now() - parseInt(start)) / (1000*60*60);
  if(hours >= 24) {
    document.body.innerHTML = '<div style="text-align:center;padding:50px"><h1>⛔ 24 گھنٹے ٹرائل ختم</h1><p>ایڈمن سے رابطہ کریں</p></div>';
    return false;
  }
  return true;
}

// Init
if(checkTrial()) {
  loadRates();
  // Auto har 1 ghante
  setInterval(loadRates, 60*60*1000);
}
</script>

</body>
</html>
